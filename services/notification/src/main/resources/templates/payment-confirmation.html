<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Confirmation</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; color: #333; }
        .wrapper { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background-color: #4CAF50; padding: 32px; text-align: center; }
        .header h1 { margin: 0; color: #ffffff; font-size: 24px; }
        .body { padding: 32px; }
        .body p { font-size: 15px; line-height: 1.6; margin: 0 0 16px; }
        .details { background-color: #f9f9f9; border-radius: 6px; padding: 20px; margin: 24px 0; }
        .details table { width: 100%; border-collapse: collapse; }
        .details td { padding: 8px 0; font-size: 15px; }
        .details td:first-child { color: #777; width: 45%; }
        .details td:last-child { font-weight: bold; }
        .footer { background-color: #f4f4f4; text-align: center; padding: 20px; font-size: 13px; color: #999; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>Payment Successful</h1>
    </div>
    <div class="body">
        <p>Hi <span th:text="${customerName}">Customer</span>,</p>
        <p>We have successfully received your payment. Here are your payment details:</p>
        <div class="details">
            <table>
                <tr>
                    <td>Order Reference</td>
                    <td th:text="${orderReference}">REF-000</td>
                </tr>
                <tr>
                    <td>Amount Paid</td>
                    <td>$<span th:text="${amount}">0.00</span></td>
                </tr>
            </table>
        </div>
        <p>Thank you for shopping with us. If you have any questions, feel free to contact our support team.</p>
    </div>
    <div class="footer">
        &copy; 2025 Ecommerce Store. All rights reserved.
    </div>
</div>
</body>
</html>
