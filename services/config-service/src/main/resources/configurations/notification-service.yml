spring:
  data:
    mongodb:
      uri: mongodb://root:123321@localhost:27017/notification?authSource=admin
  kafka:
    bootstrap-servers: localhost:9229
    consumer:
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: orderConfirmation:com.notification.kafka.order.OrderConfirmation,paymentConfirmation:com.notification.kafka.payment.PaymentConfirmation
  mail:
    host: localhost
    port: 2525
    username: root
    password: 123321
    properties:
      mail:
        smtp:
          trust: '*'
          auth: true
          starttls:
            enabled: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8040
